[project]
name = "fraase"
version = "0.2.1"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "quincyhopper", email = "216158136+quincyhopper@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu>=1.15.1",
    "openpyxl>=3.1.5",
    "pyside6>=6.12.0",
    "torch>=2.15.0",
    "transformers>=5.22.1",
]

[project.scripts]
fraase = "fraase.gui.app:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pyinstrument>=5.1.3",
    "pytest>=9.2.0",
]
